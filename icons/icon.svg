<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hairport Barbering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <pattern id="stripes" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="56" height="56" fill="#ffffff"/>
      <rect width="18" height="56" x="0" fill="#e23b3b"/>
      <rect width="18" height="56" x="28" fill="#2b6cff"/>
    </pattern>
    <clipPath id="poleClip"><rect x="222" y="150" width="68" height="212" rx="34"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55"/>

  <!-- barber pole -->
  <g clip-path="url(#poleClip)">
    <rect x="200" y="120" width="120" height="280" fill="url(#stripes)"/>
  </g>
  <rect x="222" y="150" width="68" height="212" rx="34" fill="none" stroke="#0a0a0d" stroke-width="7"/>
  <rect x="206" y="130" width="100" height="28" rx="11" fill="url(#gold)"/>
  <rect x="206" y="354" width="100" height="28" rx="11" fill="url(#gold)"/>

  <!-- monogram -->
  <text x="256" y="448" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="84" fill="url(#gold)" letter-spacing="2">H</text>
</svg>
