[project]
name = "jlr-security"
version = "0.1.0"
description = "Telegram identity verification, access tokens and permissions"
requires-python = ">=3.12"
dependencies = [
  "jlr-shared-types",
  "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlr_security"]

[tool.uv.sources]
jlr-shared-types = { workspace = true }
