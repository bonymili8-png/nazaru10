[project]
name = "jlr-diagnostic-platform"
version = "0.1.0"
description = "JLR Diagnostic Platform — simulation-first diagnostic, monitoring and configuration platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
  "jlr-shared-types",
  "jlr-protocols",
  "jlr-diagnostic-core",
  "jlr-vehicle-model",
  "jlr-security",
  "jlr-simulator",
  "jlr-gateway",
  "jlr-api",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "aiosqlite>=0.20",
  "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/diagnostic-gateway"]

[tool.uv.sources]
jlr-shared-types = { workspace = true }
jlr-protocols = { workspace = true }
jlr-diagnostic-core = { workspace = true }
jlr-vehicle-model = { workspace = true }
jlr-security = { workspace = true }
jlr-simulator = { workspace = true }
jlr-gateway = { workspace = true }
jlr-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires TEST_DATABASE_URL pointing at PostgreSQL",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "N"]
ignore = [
  "PLR0913", # diagnostic calls legitimately carry many parameters
  "PLR2004", # protocol byte constants are clearer inline next to the spec reference
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "S101",    # asserts are used for internal invariants and tests
  "RUF012",
  "PLR0917", # FastAPI handlers declare dependencies and query parameters as arguments
  "ASYNC109", # protocol timing (P2, N_Bs, N_Cr) is part of the protocol contract, not caller cancellation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PLC0415", "N802"]
"packages/simulator/**" = ["S311"]
"packages/simulator/src/jlr_simulator/profiles.py" = ["E501"] # simulation data table
"**/migrations/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = [
  "jlr_shared_types", "jlr_protocols", "jlr_diagnostic_core", "jlr_vehicle_model",
  "jlr_security", "jlr_simulator", "jlr_gateway", "jlr_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/shared-types/src", "packages/protocols/src", "packages/diagnostic-core/src",
  "packages/vehicle-model/src", "packages/security/src", "packages/simulator/src",
  "apps/diagnostic-gateway/src", "apps/api/src",
]
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = [
  "packages/shared-types/src", "packages/protocols/src", "packages/diagnostic-core/src",
  "packages/vehicle-model/src", "packages/security/src", "packages/simulator/src",
  "apps/diagnostic-gateway/src", "apps/api/src",
]
