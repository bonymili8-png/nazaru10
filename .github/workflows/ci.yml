name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thoroughline
          POSTGRES_PASSWORD: thoroughline
          POSTGRES_DB: thoroughline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thoroughline -d thoroughline_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://thoroughline:thoroughline@localhost:5432/thoroughline_test
      TEST_REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r test
      - name: Build Mini App
        run: pnpm --filter @thoroughline/web build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: Race simulation validation (10k races)
        run: pnpm sim:races 10000 ci
      - name: Economy cohort simulation (300 owners x 28 days)
        run: pnpm sim:economy 300 28

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thoroughline
          POSTGRES_PASSWORD: thoroughline
          POSTGRES_DB: thoroughline_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thoroughline -d thoroughline_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://thoroughline:thoroughline@localhost:5432/thoroughline_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @thoroughline/e2e build:web
      - run: pnpm --filter @thoroughline/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @thoroughline/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
