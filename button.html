<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Button</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f5f5f5;
    font-family: system-ui, sans-serif;
  }

  .btn {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background-color: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .btn:hover {
    background-color: #1d4ed8;
  }

  .btn:active {
    background-color: #1e40af;
  }
</style>
</head>
<body>
  <button class="btn">Click me</button>
</body>
</html>
