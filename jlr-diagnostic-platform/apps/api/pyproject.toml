[project]
name = "jlr-api"
version = "0.1.0"
description = "Backend REST API"
requires-python = ">=3.12"
dependencies = [
  "jlr-shared-types",
  "jlr-diagnostic-core",
  "jlr-vehicle-model",
  "jlr-security",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlr_api"]

[tool.uv.sources]
jlr-shared-types = { workspace = true }
jlr-diagnostic-core = { workspace = true }
jlr-vehicle-model = { workspace = true }
jlr-security = { workspace = true }
