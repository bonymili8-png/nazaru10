[project]
name = "jlr-vehicle-model"
version = "0.1.0"
description = "VIN decoding and version-aware vehicle profiles"
requires-python = ">=3.12"
dependencies = [
  "jlr-shared-types",
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlr_vehicle_model"]

[tool.uv.sources]
jlr-shared-types = { workspace = true }
