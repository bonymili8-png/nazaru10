name: JLR Diagnostic Platform

on:
  push:
    branches: [main, "claude/**"]
    paths: ["jlr-diagnostic-platform/**", ".github/workflows/jlr-diagnostic-platform.yml"]
  pull_request:
    paths: ["jlr-diagnostic-platform/**", ".github/workflows/jlr-diagnostic-platform.yml"]

defaults:
  run:
    working-directory: jlr-diagnostic-platform

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jlr
          POSTGRES_PASSWORD: jlr
          POSTGRES_DB: jlr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jlr -d jlr_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jlr:jlr@localhost:5432/jlr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/*/src apps/api/src apps/diagnostic-gateway/src tests
      - name: Migrations (upgrade + drift check)
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" uv run python -c "
          from alembic import command
          from jlr_api.__main__ import alembic_config
          config = alembic_config()
          command.upgrade(config, 'head')
          command.check(config)
          "
      - run: uv run pytest -q --cov --cov-report=term-missing:skip-covered

  mini-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jlr-diagnostic-platform/apps/telegram-mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jlr-diagnostic-platform/apps/telegram-mini-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, mini-app]
    steps:
      - uses: actions/checkout@v4
      - name: Build images and run the stack
        run: |
          docker compose up -d --build --wait
          docker compose ps
      - name: Smoke test (sign in, connect, scan, live data) through nginx
        run: scripts/smoke.sh http://localhost:8080
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
