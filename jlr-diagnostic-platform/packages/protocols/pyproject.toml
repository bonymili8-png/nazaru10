[project]
name = "jlr-protocols"
version = "0.1.0"
description = "CAN, ISO-TP, UDS, OBD-II and DoIP protocol codecs and clients"
requires-python = ">=3.12"
dependencies = [
  "jlr-shared-types",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlr_protocols"]

[tool.uv.sources]
jlr-shared-types = { workspace = true }
